<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Lâmpada interativa</title>
  <desc id="desc">Uma lâmpada acesa em destaque sobre um fundo azul-marinho com brilho suave.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162543"/>
      <stop offset="0.58" stop-color="#0b1427"/>
      <stop offset="1" stop-color="#071b26"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffe8a0" stop-opacity=".45"/>
      <stop offset=".4" stop-color="#66e4ca" stop-opacity=".13"/>
      <stop offset="1" stop-color="#66e4ca" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bulb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8d9"/>
      <stop offset=".48" stop-color="#ffe38a"/>
      <stop offset="1" stop-color="#ffb94f"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e1f0"/>
      <stop offset=".5" stop-color="#71839e"/>
      <stop offset="1" stop-color="#344158"/>
    </linearGradient>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shadow" x="-60%" y="-40%" width="220%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#020712" flood-opacity=".6"/>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#a3bddf" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="650" fill="url(#background)"/>
  <rect width="1000" height="650" fill="url(#grid)"/>
  <ellipse cx="500" cy="300" rx="320" ry="290" fill="url(#halo)"/>
  <circle cx="500" cy="290" r="102" fill="#ffdf83" opacity=".32" filter="url(#soft-glow)"/>
  <g fill="#b9cbe1" opacity=".65">
    <circle cx="236" cy="197" r="2"/><circle cx="744" cy="210" r="2"/><circle cx="292" cy="430" r="1.5"/>
    <circle cx="712" cy="404" r="1.5"/><circle cx="337" cy="128" r="1"/><circle cx="668" cy="137" r="1"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M500 137c-88 0-151 63-151 145 0 59 29 97 67 137 20 21 31 39 34 66h100c3-27 14-45 34-66 38-40 67-78 67-137 0-82-63-145-151-145Z" fill="url(#bulb)" stroke="#fff4ca" stroke-opacity=".85" stroke-width="3"/>
    <path d="M435 253c15-22 39-36 65-36s50 14 65 36" fill="none" stroke="#fffdf3" stroke-opacity=".7" stroke-width="8" stroke-linecap="round"/>
    <path d="M461 306c12-16 26-24 39-24s27 8 39 24l-18 41h-42l-18-41Z" fill="none" stroke="#fff8df" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M500 348v70" fill="none" stroke="#fff4c5" stroke-width="7" stroke-linecap="round"/>
    <path d="M450 485h100l-5 18h-90l-5-18Zm4 26h92l-5 18h-82l-5-18Zm8 26h76l-7 18h-62l-7-18Z" fill="url(#base)" stroke="#d7e1ef" stroke-opacity=".36" stroke-width="2"/>
    <path d="M477 565h46l-8 17h-30l-8-17Z" fill="#27344a" stroke="#a2b4ce" stroke-opacity=".55" stroke-width="2"/>
  </g>
  <text x="500" y="615" text-anchor="middle" fill="#d4e4f4" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="650" letter-spacing="3" opacity=".8">CLIQUE PARA INTERAGIR</text>
</svg>
